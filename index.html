<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <title>ループ・ミー</title>
  <meta name="description" content="10秒ごとに時間が巻き戻る。過去の自分（ゴースト）と協力して解く、1人協力アクションパズル。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="stage-wrap">
      <canvas id="game" width="768" height="480" aria-label="ゲーム画面"></canvas>
      <div id="overlay" class="hidden"></div>
    </div>

    <div id="touch" aria-label="タッチ操作">
      <div class="pad">
        <button data-hold="L" aria-label="左">◀</button>
        <button data-hold="R" aria-label="右">▶</button>
      </div>
      <div class="pad small">
        <button data-action="undo" aria-label="ひとつ前のループを取り消し">↶</button>
        <button data-action="menu" aria-label="メニュー">≡</button>
        <button data-action="mute" aria-label="音のオン・オフ">🔊</button>
      </div>
      <div class="pad">
        <button data-action="rewind" class="rew" aria-label="巻き戻し">⟲</button>
        <button data-hold="J" class="jump" aria-label="ジャンプ">JUMP</button>
      </div>
    </div>

    <p id="help">
      <kbd>←</kbd><kbd>→</kbd> 移動 ・ <kbd>Space</kbd> ジャンプ ・ <kbd>R</kbd> 巻き戻し ・
      <kbd>U</kbd> 取り消し ・ <kbd>X</kbd> やり直し ・ <kbd>Esc</kbd> メニュー ・ <kbd>M</kbd> 音
    </p>
  </main>

  <script src="src/engine.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
